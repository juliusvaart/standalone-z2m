map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, resolved per request so the portal keeps serving
    # while Zigbee2MQTT or the bridge restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;

    location = / {
        index index.html;
    }

    location = /index.html { }

    # Zigbee2MQTT frontend. Its base_url is /z2m, so the prefix is passed through.
    location /z2m/ {
        set $z2m_upstream zigbee2mqtt:8080;
        proxy_pass http://$z2m_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 7d;
    }

    # Switch binding UI. It serves from its own root, so the prefix is stripped.
    location /switches/ {
        set $switchboard_upstream switchboard:3000;
        rewrite ^/switches/(.*)$ /$1 break;
        proxy_pass http://$switchboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
    }

    location = /switches { return 301 $scheme://$http_host/switches/; }
    location = /z2m     { return 301 $scheme://$http_host/z2m/; }
}
