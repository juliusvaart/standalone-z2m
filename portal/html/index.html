<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Home Portal</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f5f7;
    --card: #ffffff;
    --fg: #16181d;
    --muted: #5d636e;
    --line: #dfe2e8;
    --accent: #3b6fd4;
  }
  /* The OS decides unless the toggle has pinned a theme. color-scheme has to be
     a concrete value in each state, otherwise native widgets and scrollbars keep
     following the OS and desync from an explicit choice. The dark tokens are
     written twice because a media query and an attribute selector cannot share a
     rule. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14161a;
      --card: #1d2026;
      --fg: #edeff3;
      --muted: #9aa1ad;
      --line: #2c313a;
      --accent: #6d9bf0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161a;
    --card: #1d2026;
    --fg: #edeff3;
    --muted: #9aa1ad;
    --line: #2c313a;
    --accent: #6d9bf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 760px; }
  .head { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
  h1 { margin: 0 0 6px; font-size: 28px; }
  p.sub { margin: 0; color: var(--muted); }
  .theme-toggle {
    flex: none;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  a.card {
    display: block;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  a.card h2 { margin: 0 0 6px; font-size: 19px; }
  a.card p { margin: 0; color: var(--muted); font-size: 14px; }
  .icon { font-size: 28px; line-height: 1; margin-bottom: 12px; }
</style>
<script>
  // Stamped before the first paint so an explicit theme never flashes the other one.
  try {
    var pref = localStorage.getItem('theme');
    if (pref === 'light' || pref === 'dark') document.documentElement.dataset.theme = pref;
  } catch (err) {}
</script>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Smart Home Portal</h1>
      <p class="sub">Zigbee2MQTT with Friends of Hue switch bindings.</p>
    </div>
    <button type="button" id="theme" class="theme-toggle"></button>
  </div>
  <div class="grid">
    <a class="card" href="/switches/">
      <div class="icon">&#128161;</div>
      <h2>Switchboard</h2>
      <p>Bind battery switches to Zigbee2MQTT groups, lights or Home Assistant entities. Keeps working when Home Assistant is down.</p>
    </a>
    <a class="card" href="/z2m/">
      <div class="icon">&#128225;</div>
      <h2>Zigbee2MQTT</h2>
      <p>Pair devices, build groups, inspect the Zigbee network and device settings.</p>
    </a>
  </div>
</main>
<script>
  // Same preference key and cycle as the switchboard; both pages share an origin,
  // so a choice made here carries over to /switches/ and back.
  var THEMES = ['auto', 'light', 'dark'];
  var THEME_NAMES = { auto: 'Auto', light: 'Light', dark: 'Dark' };

  function storedTheme() {
    try {
      var pref = localStorage.getItem('theme');
      return THEMES.indexOf(pref) === -1 ? 'auto' : pref;
    } catch (err) {
      return 'auto';
    }
  }

  function applyTheme(pref) {
    if (pref === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = pref;
    try {
      if (pref === 'auto') localStorage.removeItem('theme');
      else localStorage.setItem('theme', pref);
    } catch (err) {}
    document.getElementById('theme').textContent = 'Theme: ' + THEME_NAMES[pref];
  }

  document.getElementById('theme').addEventListener('click', function () {
    applyTheme(THEMES[(THEMES.indexOf(storedTheme()) + 1) % THEMES.length]);
  });

  applyTheme(storedTheme());
</script>
</body>
</html>
